<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Cotizador de construcción: partidas, materiales, mano de obra y presupuestos en PDF.">
  <title>Cotizador de construcción</title>
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./vendor/jspdf.umd.min.js"></script>
  <script defer src="./vendor/jspdf.plugin.autotable.min.js"></script>
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <a class="skip" href="#contenido">Ir al contenido</a>
  <header class="app-header">
    <a class="brand" href="#">Cotizador <span>de construcción</span></a>
    <nav aria-label="Principal"><button id="ir-lista" type="button">Cotizaciones</button><button id="configuracion" type="button">Configuración</button></nav>
  </header>
  <div id="aviso-guardado" class="notice" role="status" hidden></div>
  <div id="mensaje" class="notice" role="status" hidden></div>
  <main id="contenido" tabindex="-1"></main>
  <dialog id="dialogo" aria-labelledby="dialogo-titulo"></dialog>
  <noscript>Activa JavaScript para usar el cotizador. Todos los datos se guardan en este navegador.</noscript>
</body>
</html>
